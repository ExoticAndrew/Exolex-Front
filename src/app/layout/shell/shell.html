<div class="shell">
  <aside class="shell__sidebar">
    <a routerLink="/app" class="shell__logo">
      <img src="logo2.png" alt="Exolex" />
    </a>

    <nav class="shell__nav">
      <a routerLink="/app/clientes" routerLinkActive="shell__nav-link--active" class="shell__nav-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        Clientes
      </a>

      <a routerLink="/app/processos" routerLinkActive="shell__nav-link--active" class="shell__nav-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M14 2v6h6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Processos
      </a>

      <a routerLink="/app/prazos" routerLinkActive="shell__nav-link--active" class="shell__nav-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M13.73 21a2 2 0 0 1-3.46 0" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Prazos
      </a>
    </nav>

    <button class="shell__logout" (click)="logout()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M16 17l5-5-5-5M21 12H9" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Sair
    </button>
  </aside>

  <div class="shell__main">
    <header class="shell__header">
      <span class="shell__user">Olá, {{ authService.nome() }}</span>
    </header>

    <main class="shell__content">
      <router-outlet />
    </main>
  </div>
</div>
