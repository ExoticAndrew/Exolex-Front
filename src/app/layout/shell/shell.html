<div class="shell">
  <aside class="shell__sidebar">
    <a routerLink="/app" class="shell__logo">
      <img src="logo2.png" alt="Exolex" />
    </a>

    <nav class="shell__nav">
      <a routerLink="/app" routerLinkActive="shell__nav-link--active" [routerLinkActiveOptions]="{ exact: true }" class="shell__nav-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M9 22V12h6v10" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Início</span>
      </a>

      <a routerLink="/app/clientes" routerLinkActive="shell__nav-link--active" class="shell__nav-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <span>Clientes</span>
      </a>

      <a routerLink="/app/processos" routerLinkActive="shell__nav-link--active" class="shell__nav-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M14 2v6h6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Processos</span>
      </a>
    </nav>
    <button class="shell__logout" (click)="logout()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M16 17l5-5-5-5M21 12H9" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>Sair</span>
    </button>
  </aside>

  <div class="shell__main">
        <header class="shell__header">
      <app-notificacao-sino />
      <div class="shell__user">
        <span class="shell__user-nome">Olá, {{ primeiroNome }}</span>
        <button class="shell__avatar-btn" (click)="abrirSeletorFoto()" title="Trocar foto de perfil">
          <app-avatar [nome]="authService.nome() ?? ''" [fotoUrl]="authService.fotoUrl()" tamanho="md" />
        </button>
        <input #inputFoto type="file" accept="image/png, image/jpeg, image/webp" hidden (change)="onFotoSelecionada($event)" />
      </div>
    </header>

    <main class="shell__content">
      <router-outlet />
    </main>
  </div>
</div>
