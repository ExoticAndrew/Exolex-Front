<section class="how-it-works">
  <video
    class="how-it-works__video"
    src="how-it-works.mp4"
    autoplay
    [muted]="true"
    loop
    playsinline
  ></video>

  <div class="how-it-works__card">
    <span class="how-it-works__label how-it-works__fade-item" style="animation-delay: 0.1s">
      Gestão Inteligente
    </span>
    <span class="how-it-works__label-line how-it-works__fade-item" style="animation-delay: 0.2s"></span>

    <h2 class="how-it-works__title how-it-works__fade-item" style="animation-delay: 0.3s">
      Transforme a<br />
      <span class="how-it-works__highlight">gestão</span><br />
      do seu escritório.
    </h2>

    <p class="how-it-works__description how-it-works__fade-item" style="animation-delay: 0.45s">
      Centralize clientes, processos, documentos, equipes e prazos em uma
      única plataforma moderna, segura e intuitiva.
    </p>

    <ul class="how-it-works__features">
      <li class="how-it-works__fade-item" style="animation-delay: 0.6s">
        <span class="how-it-works__icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </span>
        Cliente cadastrado
      </li>
      <li class="how-it-works__fade-item" style="animation-delay: 0.72s">
        <span class="how-it-works__icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M14 2v6h6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        Processo criado e vinculado
      </li>
      <li class="how-it-works__fade-item" style="animation-delay: 0.84s">
        <span class="how-it-works__icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        Equipe recebe permissões
      </li>
      <li class="how-it-works__fade-item" style="animation-delay: 0.96s">
        <span class="how-it-works__icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M13.73 21a2 2 0 0 1-3.46 0" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        Prazos e notificações automáticas
      </li>
    </ul>

    <button
      class="how-it-works__cta how-it-works__fade-item"
      style="animation-delay: 1.1s"
      routerLink="/cadastro"
    >
      Conheça o sistema
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M5 12h14M12 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>
</section>
